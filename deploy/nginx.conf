# Сайт для nginx. Скрипт установки подставляет сюда домен из APP_DOMAIN и
# кладёт результат в /etc/nginx/sites-available/pari-mixer.
# HTTPS добавляет certbot: certbot --nginx -d ваш.домен

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Сбор данных иногда отвечает не мгновенно, а холодных стартов здесь нет -
    # но пусть запас будет тот же, что у gunicorn.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отдаём статику напрямую, не гоняя её через один-единственный воркер.
    location ~ ^/(app\.js|style\.css|favicon\.ico)$ {
        root /opt/pari-mixer-scraper/static;
        access_log off;
        expires 1h;
    }
}
